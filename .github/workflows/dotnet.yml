# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger:junit /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura --results-directory ./TestResults
    - name: Pack
      run: dotnet pack
    - name: Official SonarQube Scan
      # You may pin to the exact commit or the version.
      # uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
      uses: SonarSource/sonarqube-scan-action@v8.1.0
      with:
        # Additional arguments to the Sonar Scanner CLI
        args: # optional, default is 
        # Set the sonar.projectBaseDir analysis property
        projectBaseDir: # optional, default is .
        # Version of the Sonar Scanner CLI to use
        scannerVersion: # optional, default is 8.1.0.6389
        # URL to download the Sonar Scanner CLI binaries from
        scannerBinariesUrl: # optional, default is https://binaries.sonarsource.com/Distribution/sonar-scanner-cli
        # Skip GPG signature verification (not recommended for security)
        skipSignatureVerification: # optional, default is false
          
